<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | nik-greb.com</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Admin-specific styles -->
    <link rel="stylesheet" href="admin.css">

    <!-- Firebase SDK (compat build) -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>

         Add it back (and uncomment the login-screen div + admin.js auth block)
         before this panel goes anywhere public. -->
</head>
<body>

    <div id="admin-panel">
        <!-- DEV MODE: login screen disabled. Restore this before going public:
        <div id="login-screen">
            <div class="login-box">
                <h2>Admin Login</h2>
                <p class="login-sub">nik-greb.com content management</p>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Sign In</button>
                    <p id="login-error"></p>
                </form>
            </div>
        </div>
        -->

        <div class="admin-container">
            <div class="admin-sidebar">
                <h3>Admin Panel</h3>
                <div class="admin-project">ayge-722bd</div>
                <ul class="admin-tabs">
                    <li class="admin-tab active" data-tab="site">Site &amp; SEO</li>
                    <li class="admin-tab" data-tab="artDirection">Art Direction</li>
                    <li class="admin-tab" data-tab="photoGallery">Photo Gallery</li>
                </ul>
                <button id="logout-btn">Logout</button>
            </div>
            <div class="admin-content">
                <a href="index.html" id="admin-close-btn" title="Go to Main Site">×</a>
                <div class="tab-content active" data-tab-content="site"></div>
                <div class="tab-content" data-tab-content="artDirection"></div>
                <div class="tab-content" data-tab-content="photoGallery"></div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
